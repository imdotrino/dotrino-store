name: Deploy store to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'store/**'
      - '.github/workflows/deploy-store.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-store
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar meta de commit
        run: |
          COMMIT=${GITHUB_SHA::7}
          sed -i "s|</head>|  <meta name=\"commit\" content=\"$COMMIT\" />\\n</head>|" store/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./store
      - id: deployment
        uses: actions/deploy-pages@v4
